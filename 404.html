<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Stackly</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Global Project Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            background-color: var(--surface);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            background-image: radial-gradient(circle at top right, rgba(30, 58, 138, 0.05) 0%, transparent 60%),
                              radial-gradient(circle at bottom left, rgba(223, 183, 140, 0.1) 0%, transparent 60%);
        }

        .error-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--outline-variant);
            box-shadow: 0 10px 40px rgba(30, 58, 138, 0.08);
            padding: 4rem 3rem;
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Decorative top accent */
        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary-container));
        }

        .error-code-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
        }

        .error-code-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary-container));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(30, 58, 138, 0.1);
        }

        .error-code-icon {
            font-size: 7rem; /* slightly smaller than text to look balanced */
            background: linear-gradient(135deg, var(--primary), var(--secondary-container));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(30, 58, 138, 0.2));
            animation: pulse-icon 2s infinite alternate;
        }

        @keyframes pulse-icon {
            0% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(30, 58, 138, 0.2)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 4px 20px rgba(223, 183, 140, 0.4)); }
        }

        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.8rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .error-text {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        
        /* Removed the top ghost icon since we now have the icon in the center of 404 */

        /* Responsive Breakpoints down to 320px */
        @media (max-width: 576px) {
            .error-card {
                padding: 3rem 1.5rem;
                border-radius: 16px;
            }
            .error-code-text {
                font-size: 5.5rem;
            }
            .error-code-icon {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.4rem;
            }
            .error-text {
                font-size: 0.95rem;
                margin-bottom: 2rem;
            }
            .btn-container {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }
            .btn-container .btn {
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 360px) {
            body { padding: 1rem; }
            .error-card { padding: 2rem 1.25rem; }
            .error-code-text { font-size: 4rem; }
            .error-code-icon { font-size: 3.5rem; }
            .error-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="error-card">
        
        <!-- Modern 404 text with icon replacing the 0 -->
        <div class="error-code-wrapper">
            <span class="error-code-text">4</span>
            <span class="material-symbols-outlined error-code-icon">error</span>
            <span class="error-code-text">4</span>
        </div>
        
        <h3 class="error-title">Page Not Found</h3>
        <p class="error-text">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
        </p>
        
        <div class="btn-container d-flex justify-content-center gap-3">
            <button onclick="window.history.back()" class="btn btn-premium btn-premium-secondary rounded-pill px-4 py-2 font-button fw-bold d-flex align-items-center gap-2">
                <span class="material-symbols-outlined fs-5">arrow_back</span>
                Go Back
            </button>
            <a href="index.html" class="btn btn-premium btn-premium-primary rounded-pill px-4 py-2 font-button fw-bold d-flex align-items-center gap-2 text-decoration-none">
                <span class="material-symbols-outlined fs-5">home</span>
                Back to Home
            </a>
        </div>
    </div>

</body>
</html>
