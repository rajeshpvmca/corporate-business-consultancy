<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Stackly Consulting</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
            background-color: var(--background);
            overflow-x: hidden;
        }

        @keyframes subtleBgZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .bg-animated {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110vw;
            height: 110vh;
            background-image: url('assets/images/img_01.webp');
            background-size: cover;
            background-position: center;
            z-index: 0;
            animation: subtleBgZoom 25s ease-in-out infinite;
        }

        .auth-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 0;
        }

        .auth-card {
            background: #ffffff;
            border-top: 4px solid var(--primary);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1) !important;
            position: relative;
            z-index: 1;
        }

        .unique-role-selector {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .unique-role-item {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 5px;
            background: var(--surface-variant);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .unique-role-item span.material-symbols-outlined {
            font-size: 1.5rem;
            color: var(--on-surface-variant);
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .unique-role-item .role-text {
            font-weight: 700;
            color: var(--on-surface-variant);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        @media (max-width: 576px) {
            .unique-role-selector {
                gap: 5px;
            }
            .unique-role-item {
                padding: 10px 2px;
                border-radius: 8px;
            }
            .unique-role-item span.material-symbols-outlined {
                font-size: 1.2rem;
            }
            .unique-role-item .role-text {
                font-size: 0.6rem;
                letter-spacing: 0;
            }
        }

        .btn-check:checked + .unique-role-item {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 8px 15px rgba(26, 54, 93, 0.2);
            transform: translateY(-4px);
        }

        .btn-check:checked + .unique-role-item span.material-symbols-outlined,
        .btn-check:checked + .unique-role-item .role-text {
            color: #ffffff;
        }

        .unique-role-item:hover {
            border-color: var(--secondary-container);
            transform: translateY(-2px);
        }

        .auth-input-modern {
            background: #ffffff !important;
            border: 2px solid var(--outline-variant) !important;
            border-radius: 8px;
            color: var(--on-surface) !important;
            padding: 0.8rem 1rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .auth-input-modern:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(26, 54, 93, 0.1);
        }

        .auth-input-modern::placeholder {
            color: var(--on-surface-variant);
            opacity: 0.6;
        }

        .auth-link {
            color: var(--primary);
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-link:hover {
            color: var(--secondary-container);
        }

        .toggle-password {
            background: transparent;
            border: 2px solid var(--outline-variant);
            color: var(--on-surface-variant);
            border-left: none;
        }
        .toggle-password:hover {
            color: var(--primary);
        }
        
        .custom-checkbox:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>

<body class="font-body-md text-on-surface">

    <!-- Animated Background Image -->
    <div class="bg-animated"></div>

    <div class="auth-overlay"></div>

    <div class="container position-relative z-1 py-3">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-7 col-xl-6">
                <div class="auth-card rounded-4 p-4 p-lg-5" data-aos="zoom-in">
                    
                    <div class="text-center mb-5">
                        <a href="index.html" class="small auth-link mb-3 d-inline-block"><i class="fas fa-arrow-left me-2"></i> Return to Portal</a>
                        <h2 class="display-6 font-heading fw-bold mb-2">Secure Access</h2>
                        <p class="text-on-surface-variant">Please identify your role to continue to the Stackly Portal.</p>
                    </div>

                    <form id="loginForm">
                        <label class="form-label text-on-surface-variant small fw-bold tracking-widest text-uppercase mb-3 d-block text-center font-label-caps">Role Authorization</label>
                        <div class="unique-role-selector mb-4">
                            <!-- Role 1: Client -->
                            <input type="radio" class="btn-check" name="loginRole" id="roleClient" value="Client" checked autocomplete="off">
                            <label class="unique-role-item" for="roleClient">
                                <span class="material-symbols-outlined fs-3 mb-1">domain</span>
                                <span class="role-text font-button">Client</span>
                            </label>

                            <!-- Role 2: Consultant -->
                            <input type="radio" class="btn-check" name="loginRole" id="roleConsultant" value="Consultant" autocomplete="off">
                            <label class="unique-role-item" for="roleConsultant">
                                <span class="material-symbols-outlined fs-3 mb-1">work</span>
                                <span class="role-text font-button">Consultant</span>
                            </label>

                            <!-- Role 3: Partner -->
                            <input type="radio" class="btn-check" name="loginRole" id="rolePartner" value="Partner" autocomplete="off">
                            <label class="unique-role-item" for="rolePartner">
                                <span class="material-symbols-outlined fs-3 mb-1">handshake</span>
                                <span class="role-text font-button">Partner</span>
                            </label>

                            <!-- Role 4: Admin -->
                            <input type="radio" class="btn-check" name="loginRole" id="roleAdmin" value="Admin" autocomplete="off">
                            <label class="unique-role-item" for="roleAdmin">
                                <span class="material-symbols-outlined fs-3 mb-1">admin_panel_settings</span>
                                <span class="role-text font-button">Admin</span>
                            </label>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-on-surface-variant small fw-bold tracking-widest text-uppercase font-label-caps">Corporate Email</label>
                            <input class="form-control auth-input-modern" type="email" id="loginEmail" placeholder="name@company.com" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label text-on-surface-variant small fw-bold tracking-widest text-uppercase font-label-caps">Secure Password</label>
                            <div class="input-group">
                                <input class="form-control auth-input-modern border-end-0" type="password" id="loginPassword" placeholder="Enter password" minlength="8" required>
                                <button class="btn toggle-password" type="button" style="border-top-right-radius: 8px; border-bottom-right-radius: 8px;">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Strength bar -->
                        <div class="mb-2" style="height:4px;border-radius:4px;background:var(--outline-variant);overflow:hidden;">
                            <div id="strengthBar" style="height:100%;width:0;transition:width 0.3s, background 0.3s;"></div>
                        </div>
                        <div class="mb-4"></div>

                        <div class="d-flex justify-content-between align-items-center mb-5">
                            <div class="form-check">
                                <input class="form-check-input custom-checkbox" type="checkbox" id="remember" required>
                                <label class="form-check-label text-on-surface-variant small font-button" for="remember">Remember Session</label>
                            </div>
                            <a href="404.html" class="small auth-link font-button">Reset Credentials?</a>
                        </div>

                        <button type="submit" class="btn btn-premium btn-premium-primary font-button rounded-pill w-100 py-3 fw-bold mb-4 d-flex align-items-center justify-content-center gap-2 shadow-lg">
                            Authenticate <span class="material-symbols-outlined fs-5">login</span>
                        </button>

                        <p class="text-center mb-0 small text-on-surface-variant font-button">Don't have an account? <a href="signup.html" class="fw-bold auth-link">Register Now</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script src="js/auth.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            AOS.init({
                duration: 1000,
                once: true
            });
        });

        // Live password strength
        const pwdInput = document.getElementById('loginPassword');
        const bar = document.getElementById('strengthBar');
        const rules = {
            'r-len': v => v.length >= 8,
            'r-upper': v => /[A-Z]/.test(v),
            'r-num': v => /[0-9]/.test(v),
            'r-sym': v => /[^A-Za-z0-9]/.test(v)
        };
        const colors = ['#dc3545', '#fd7e14', '#ffc107', '#198754'];
        
        pwdInput.addEventListener('input', () => {
            const v = pwdInput.value;
            let passed = 0;
            Object.values(rules).forEach(fn => {
                if (fn(v)) passed++;
            });
            bar.style.width = (passed / 4 * 100) + '%';
            bar.style.background = colors[passed - 1] || 'var(--outline-variant)';
        });
    </script>
</body>
</html>
